# 镜像源统一表：名称 环境变量 镜像地址
# 默认不设置这些变量，即使用官方源，由 mirror on/off 切换
# npm 与 pnpm 的变量名不同，pnpm 不读取 npm_config_registry
npm     npm_config_registry   https://registry.npmmirror.com/
pnpm    pnpm_config_registry  https://registry.npmmirror.com/
uv      UV_DEFAULT_INDEX      https://mirrors.aliyun.com/pypi/simple
rustup  RUSTUP_DIST_SERVER    https://rsproxy.cn
rustup  RUSTUP_UPDATE_ROOT    https://rsproxy.cn/rustup
