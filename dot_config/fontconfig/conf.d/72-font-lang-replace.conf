    </match>
    <match target="pattern">
        <test qual="any" name="family"><string>Source Han Sans CN</string></test>
        <test name="lang" compare="contains"><string>en</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Source Han Sans</string></edit>
    </match>

    <!-- Source Han Serif CN -->
    <match target="pattern">
        <test qual="any" name="family"><string>Source Han Serif CN</string></test>
        <test name="lang" compare="contains"><string>zh-HK</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Source Han Serif HK</string></edit>
    </match>
    <match target="pattern">
        <test qual="any" name="family"><string>Source Han Serif CN</string></test>
