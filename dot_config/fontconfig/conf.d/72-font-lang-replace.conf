<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "/usr/share/xml/fontconfig/fonts.dtd">

<!-- TODO -->

<fontconfig>
    <!-- MiSans -->
    <match target="pattern">
        <test qual="any" name="family"><string>MiSans</string></test>
        <test name="lang" compare="contains"><string>zh-Hant</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>MiSans TC</string></edit>
    </match>
    <match target="pattern">
        <test qual="any" name="family"><string>MiSans</string></test>
        <test name="lang" compare="contains"><string>zh-HK</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>MiSans TC</string></edit>
    </match>
    <match target="pattern">
        <test qual="any" name="family"><string>MiSans</string></test>
        <test name="lang" compare="contains"><string>zh-TW</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>MiSans TC</string></edit>
    </match>

    <!-- 霞鹜文楷 -->
    <match target="pattern">
        <test qual="any" name="family"><string>霞鹜文楷</string></test>
        <test name="lang" compare="contains"><string>zh-Hant</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>霞鹜文楷 TC</string></edit>
    </match>
    <match target="pattern">
        <test qual="any" name="family"><string>霞鹜文楷</string></test>
        <test name="lang" compare="contains"><string>zh-HK</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>霞鹜文楷 TC</string></edit>
    </match>
    <match target="pattern">
        <test qual="any" name="family"><string>霞鹜文楷</string></test>
        <test name="lang" compare="contains"><string>zh-TW</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>霞鹜文楷 TC</string></edit>
    </match>
        <match target="pattern">
        <test qual="any" name="family"><string>霞鹜文楷</string></test>
        <test name="lang" compare="contains"><string>ja</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Klee One</string></edit>
    </match>

    <!-- Noto Sans CJK SC -->
    <match target="pattern">
        <test qual="any" name="family"><string>Noto Sans CJK SC</string></test>
        <test name="lang" compare="contains"><string>zh-HK</string></test>
