    <match target="pattern">
        <test qual="any" name="family"><string>Noto Sans CJK SC</string></test>
        <test name="lang" compare="contains"><string>ko</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK KR</string></edit>
    </match>
    <match target="pattern">
        <test qual="any" name="family"><string>Noto Sans CJK SC</string></test>
        <test name="lang" compare="contains"><string>en</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit>
    </match>

