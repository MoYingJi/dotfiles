    <match target="pattern">
        <test qual="any" name="family"><string>Source Han Serif CN</string></test>
        <test name="lang" compare="contains"><string>ja</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Source Han Serif JP</string></edit>
