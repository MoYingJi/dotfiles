<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "/usr/share/xml/fontconfig/fonts.dtd">
<fontconfig>

    <!--
        多伪字体简化版：

        SF-System   总入口
        SF-Latin    西文
        SF-SC       简体中文
        SF-TC       繁体中文
        SF-HK       香港繁体
        SF-JP       日文
        SF-KR       韩文
    -->

    <!-- 将 Apple / system 关键字指向总入口 -->

    <!-- <alias binding="same">
        <family>-apple-system</family>
        <prefer>
            <family>SF-System</family>
        </prefer>
    </alias> -->

    <!-- <alias binding="same">
        <family>BlinkMacSystemFont</family>
        <prefer>
            <family>SF-System</family>
        </prefer>
    </alias> -->

    <!-- <alias binding="same">
        <family>system-ui</family>
        <prefer>
            <family>SF-System</family>
        </prefer>
    </alias> -->

    <!-- 语言路由：只保留常见标签，后续可自行增加 -->

    <!-- 香港繁体：zh-hant-hk -->
    <match target="pattern">
        <test qual="any" name="family" compare="eq">
            <string>SF-System</string>
        </test>
        <test qual="any" name="lang" compare="contains">
            <string>zh-hant-hk</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>SF-HK</string>
        </edit>
    </match>

    <!-- 香港繁体：zh-hk -->
    <match target="pattern">
        <test qual="any" name="family" compare="eq">
            <string>SF-System</string>
        </test>
        <test qual="any" name="lang" compare="contains">
            <string>zh-hk</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>SF-HK</string>
        </edit>
    </match>

    <!-- 繁体中文：zh-tw -->
    <match target="pattern">
        <test qual="any" name="family" compare="eq">
            <string>SF-System</string>
        </test>
        <test qual="any" name="lang" compare="contains">
            <string>zh-tw</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>SF-TC</string>
        </edit>
    </match>

    <!-- 繁体中文：zh-hant -->
    <match target="pattern">
        <test qual="any" name="family" compare="eq">
            <string>SF-System</string>
        </test>
        <test qual="any" name="lang" compare="contains">
            <string>zh-hant</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>SF-TC</string>
        </edit>
    </match>

    <!-- 中文兜底：默认简体 -->
    <match target="pattern">
        <test qual="any" name="family" compare="eq">
            <string>SF-System</string>
        </test>
        <test qual="any" name="lang" compare="contains">
            <string>zh</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>SF-SC</string>
        </edit>
    </match>

    <!-- 日文 -->
    <match target="pattern">
        <test qual="any" name="family" compare="eq">
            <string>SF-System</string>
        </test>
        <test qual="any" name="lang" compare="contains">
            <string>ja</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>SF-JP</string>
        </edit>
    </match>

    <!-- 韩文 -->
    <match target="pattern">
        <test qual="any" name="family" compare="eq">
            <string>SF-System</string>
        </test>
        <test qual="any" name="lang" compare="contains">
            <string>ko</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>SF-KR</string>
        </edit>
    </match>

    <!-- 默认：非中日韩语言走西文 -->
    <match target="pattern">
        <test qual="any" name="family" compare="eq">
            <string>SF-System</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>SF-Latin</string>
            <string>sans-serif</string>
        </edit>
    </match>

    <!--
        下面是各个伪字体的实际字体栈。
        注意顺序：
        先定义 CJK 伪字体，再定义 SF-Latin。
        因为 SF-SC / SF-TC 等会引用 SF-Latin，
        SF-Latin 放在后面可以继续展开。
    -->

    <!-- 香港繁体 -->
    <alias binding="same">
        <family>SF-HK</family>
        <prefer>
            <family>SF-Latin</family>
            <family>PingFang HK</family>
            <family>Noto Sans CJK HK</family>
            <family>Source Han Sans HK</family>
            <family>Noto Sans CJK TC</family>
            <family>Source Han Sans TC</family>
            <family>PingFang TC</family>
            <family>sans-serif</family>
        </prefer>
    </alias>

    <!-- 繁体中文 -->
    <alias binding="same">
        <family>SF-TC</family>
        <prefer>
            <family>SF-Latin</family>
            <family>PingFang TC</family>
            <family>Noto Sans CJK TC</family>
            <family>Source Han Sans TC</family>
            <family>Source Han Sans TW</family>
            <family>Noto Sans CJK HK</family>
            <family>sans-serif</family>
        </prefer>
    </alias>

    <!-- 简体中文 -->
    <alias binding="same">
        <family>SF-SC</family>
        <prefer>
            <family>SF-Latin</family>
            <family>PingFang SC</family>
            <family>Noto Sans CJK SC</family>
            <family>Source Han Sans SC</family>
            <family>Source Han Sans CN</family>
            <family>sans-serif</family>
        </prefer>
    </alias>

    <!-- 日文 -->
    <alias binding="same">
        <family>SF-JP</family>
        <prefer>
            <family>SF-Latin</family>
            <family>Hiragino Sans</family>
            <family>Hiragino Kaku Gothic ProN</family>
            <family>Hiragino Kaku Gothic Pro</family>
            <family>Noto Sans JP</family>
            <family>Source Han Sans JP</family>
            <family>Noto Sans CJK JP</family>
            <family>sans-serif</family>
        </prefer>
    </alias>

    <!-- 韩文 -->
    <alias binding="same">
        <family>SF-KR</family>
        <prefer>
            <family>SF-Latin</family>
            <family>Apple SD Gothic Neo</family>
            <family>Noto Sans KR</family>
            <family>Source Han Sans KR</family>
            <family>Noto Sans CJK KR</family>
            <family>NanumGothic</family>
            <family>sans-serif</family>
        </prefer>
    </alias>

    <!-- 西文 -->
    <alias binding="same">
        <family>SF-Latin</family>
        <prefer>
            <family>SF Pro Display</family>
            <family>SF Pro Text</family>
            <family>SF Pro</family>
            <family>Helvetica Neue</family>
            <family>Inter</family>
            <family>Inter Variable</family>
            <family>Inter Display</family>
            <family>Roboto</family>
            <family>Noto Sans</family>
            <family>Liberation Sans</family>
            <family>Arial</family>
            <family>DejaVu Sans</family>
        </prefer>
    </alias>

</fontconfig>
