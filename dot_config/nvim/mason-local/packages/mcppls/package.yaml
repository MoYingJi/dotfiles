---
name: mcppls
description: C++20/23 modules language server for mcpp, CMake, compile_commands.json and source-only projects
homepage: https://github.com/Sunrisepeak/mcpp-language-server
licenses:
    - Apache-2.0
languages:
    - C
    - C++
categories:
    - LSP
source:
    id: pkg:github/Sunrisepeak/mcpp-language-server@v0.23.0
    asset:
        - target: linux_x64_gnu
          file: mcppls-0.23.0-linux-x86_64
          bin: mcppls-0.23.0-linux-x86_64
        - target: linux_arm64_gnu
          file: mcppls-0.23.0-linux-aarch64
          bin: mcppls-0.23.0-linux-aarch64
        - target: darwin_arm64
          file: mcppls-0.23.0-macos-aarch64
          bin: mcppls-0.23.0-macos-aarch64
        - target: win_x64
          file: mcppls-0.23.0-windows-x86_64.exe
          bin: mcppls-0.23.0-windows-x86_64.exe
bin:
    mcppls: "{{source.asset.bin}}"
